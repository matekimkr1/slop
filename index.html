<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<title>GTO 레인지 — Section 1</title>
<style>
:root{
  --bg:#0B0F14; --panel:#151E27; --panel2:#1C2731; --line:#26323D;
  --fg:#E8EEF4; --dim:#8496A5; --dim2:#5D6E7C;
  --A:#8E3230; --R:#E8615E; --C:#7CC47C; --F:#5A9BE0;
  --gold:#F0C05A; --mint:#5CE08F;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--fg);overflow-x:hidden;min-height:100%;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(40px + var(--sb));
}
button,input{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{cursor:auto}

/* 원본 JPEG을 CSS로 크롭 (재인코딩 없음) */
.crop{position:relative;overflow:hidden;width:100%;background:#0E141A;
  aspect-ratio:calc(var(--w)) / calc(var(--h))}
.crop img{position:absolute;max-width:none;display:block;
  width:calc(100% * var(--iw) / var(--w));
  left:calc(-100% * var(--x) / var(--w));
  top:calc(-100% * var(--y) / var(--h))}

header{padding:calc(12px + var(--st)) 14px 10px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;font-weight:800}
header h1 b{color:var(--mint)}
header .sub{font-size:11px;color:var(--dim2);margin-top:3px}

/* ---- 스텝 ---- */
.steps{padding:4px 12px 0}
.step{margin-top:14px}
.step.off{opacity:.35;pointer-events:none}
.step .lb{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;
  color:var(--dim);letter-spacing:.05em;margin-bottom:8px}
.step .lb i{width:19px;height:19px;border-radius:50%;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim);font-style:normal;font-size:11px;
  display:grid;place-items:center;flex:0 0 auto}
.step.done .lb i{background:var(--mint);color:#08120C;border-color:var(--mint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:11px;font-size:14px;font-weight:700;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  text-align:left;line-height:1.3}
.chip small{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:2px}
.chip.on{background:var(--mint);border-color:var(--mint);color:#08120C}
.hand-row{display:flex;gap:7px}
.hand-row input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:11px;padding:13px 14px;font-size:18px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase}
.hand-row input:focus{outline:none;border-color:var(--mint)}
.hand-row button{padding:0 15px;border-radius:11px;background:var(--panel2);
  border:1px solid var(--line);font-size:13px;font-weight:700;flex:0 0 auto}
.hand-row button.on{border-color:var(--mint);color:var(--mint)}
.hint{font-size:11.5px;color:var(--dim2);margin-top:6px;line-height:1.5}
.picker{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;margin-top:9px}
.picker button{aspect-ratio:1;border-radius:4px;background:var(--panel2);font-size:9px;
  font-weight:700;color:var(--dim);display:grid;place-items:center;padding:0}
.picker button.p{background:#243040;color:var(--fg)}
.picker button.on{background:var(--mint);color:#08120C}

/* ---- 결과 ---- */
#out{padding:0 12px}
.spot{margin-top:16px;padding:11px 13px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line)}
.spot .k{font-size:10.5px;letter-spacing:.14em;color:var(--dim);font-weight:800}
.spot .v{font-size:14.5px;font-weight:700;line-height:1.4;margin-top:3px;word-break:keep-all}
.spot .v b{color:var(--mint)}
.ans{margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid #2A3B33;
  background:linear-gradient(180deg,#132019,#101820)}
.ans .top{padding:15px 14px 12px;text-align:center}
.ans .lab{font-size:10.5px;letter-spacing:.16em;color:var(--dim);font-weight:800}
.ans .act{font-size:36px;font-weight:800;line-height:1.1;margin-top:4px}
.ans .sub{font-size:13px;color:var(--dim);margin-top:5px}
.bars{padding:0 14px 14px;display:flex;flex-direction:column;gap:6px}
.bar{display:flex;align-items:center;gap:9px}
.bar .nm{width:84px;font-size:12.5px;font-weight:700;flex:0 0 auto;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;height:21px;background:#0B1016;border-radius:6px;overflow:hidden}
.bar .fl{height:100%;border-radius:6px;min-width:2px}
.bar .pc{width:44px;text-align:right;font-size:13px;font-weight:800;flex:0 0 auto;
  font-variant-numeric:tabular-nums}
.note{margin:0 14px 14px;padding:10px 12px;border-radius:10px;background:#1E1608;
  border:1px solid #4A3616;color:var(--gold);font-size:12px;line-height:1.5}
.none{margin-top:12px;padding:20px 14px;text-align:center;border-radius:14px;
  border:1px solid var(--line);background:var(--panel)}
.none .t{font-size:22px;font-weight:800;color:var(--dim)}
.none .d{font-size:12.5px;color:var(--dim2);margin-top:6px;line-height:1.5}

/* ---- 자료 ---- */
.sec{margin-top:16px}
.sec h3{font-size:11.5px;font-weight:800;letter-spacing:.13em;color:var(--dim);
  margin-bottom:8px;display:flex;align-items:center;gap:7px}
.sec h3 .tg{background:var(--panel2);border:1px solid var(--line);color:var(--dim2);
  padding:2px 8px;border-radius:999px;letter-spacing:0;font-size:10.5px;font-weight:700}
.shell{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#0E141A}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.zoombar{display:flex;align-items:center;gap:9px;margin-top:8px}
.zoombar input[type=range]{flex:1;accent-color:var(--mint);height:26px;min-width:0}
.zoombar .v{font-size:12px;color:var(--dim);font-weight:700;width:46px;text-align:right;
  font-variant-numeric:tabular-nums}
.zoombar .rst{padding:6px 11px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);font-size:12px;font-weight:700;flex:0 0 auto}
.hl{position:absolute;border:3px solid var(--gold);border-radius:3px;
  box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 18px rgba(240,192,90,.8);
  pointer-events:none;z-index:2;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 4px rgba(240,192,90,.35)}}

/* ---- 둘러보기 ---- */
details.browse{margin:22px 12px 0;border:1px solid var(--line);border-radius:14px;
  background:var(--panel);overflow:hidden}
details.browse summary{list-style:none;padding:14px 15px;font-size:14px;font-weight:800;
  display:flex;align-items:center;gap:8px;cursor:pointer}
details.browse summary::-webkit-details-marker{display:none}
details.browse summary .ar{margin-left:auto;color:var(--dim);font-size:12px}
details.browse[open] summary .ar{transform:rotate(180deg)}
.bgrid{padding:0 12px 14px;display:grid;grid-template-columns:1fr;gap:11px}
@media(min-width:620px){.bgrid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.bgrid{grid-template-columns:1fr 1fr 1fr}}
.bcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0E141A;
  text-align:left;width:100%}
.bcard img{width:100%;height:auto;display:block}
.bcard .c{padding:9px 11px;font-size:13px;font-weight:700;line-height:1.35;word-break:keep-all}
.bcard .c b{color:var(--mint)}
</style>
</head>
<body>

<header>
  <h1>GTO 레인지 <b>Section 1</b></h1>
  <div class="sub">MTT 30bb ChipEV · EP=UTG · MP=HJ · LP=BTN</div>
</header>

<div class="steps">
  <div class="step" id="s1">
    <div class="lb"><i>1</i>내 자리</div>
    <div class="chips" id="cPos"></div>
  </div>
  <div class="step off" id="s2">
    <div class="lb"><i>2</i>앞에서 무슨 일이 있었나</div>
    <div class="chips" id="cNode"></div>
  </div>
  <div class="step off" id="s3">
    <div class="lb"><i>3</i>내 핸드 <span style="font-weight:600;letter-spacing:0">(선택)</span></div>
    <div class="hand-row">
      <input id="hIn" placeholder="AKs · QQ · T9o" maxlength="4" autocomplete="off"
             autocapitalize="characters" spellcheck="false" inputmode="text">
      <button id="hTog">표에서 고르기</button>
    </div>
    <div class="hint">비우면 차트만 봅니다 · 넣으면 그 핸드 정답이 바로 나옵니다</div>
    <div class="picker" id="pick" hidden></div>
  </div>
</div>

<div id="out"></div>

<details class="browse" id="browse">
  <summary>전체 18개 노드 둘러보기 <span class="ar">▼</span></summary>
  <div class="bgrid" id="bgrid"></div>
</details>

<script>
"use strict";

const NODES = [
 {id:"ep-1",pos:"EP",label:"EP open range",                   w:2912,h:1594,split:1721,top:408},
 {id:"ep-2",pos:"EP",label:"EP open → MP 3bet → EP",          w:2940,h:1600,split:1727,top:414},
 {id:"ep-3",pos:"EP",label:"EP open → MP 3bet → LP 4bet → EP",w:2940,h:1598,split:1727,top:412},
 {id:"ep-4",pos:"EP",label:"EP open → MP call → LP 3bet → EP",w:2940,h:1592,split:1727,top:406},
 {id:"mp-1",pos:"MP",label:"MP open range",                   w:2940,h:1596,split:1727,top:410},
 {id:"mp-2",pos:"MP",label:"EP open → MP",                    w:2940,h:1590,split:1727,top:404},
 {id:"mp-3",pos:"MP",label:"MP open → LP 3bet → MP",          w:2938,h:1602,split:1727,top:416},
 {id:"lp-1",pos:"LP",label:"LP open range",                   w:2940,h:1598,split:1727,top:412},
 {id:"lp-2",pos:"LP",label:"EP open → LP",                    w:2940,h:1594,split:1727,top:409},
 {id:"lp-3",pos:"LP",label:"EP open → MP 3bet → LP",          w:2940,h:1594,split:1727,top:408},
 {id:"lp-4",pos:"LP",label:"EP open → MP call → LP",          w:2940,h:1592,split:1727,top:406},
 {id:"sb-1",pos:"SB",label:"SB open range",                   w:2940,h:1596,split:1727,top:410},
 {id:"sb-2",pos:"SB",label:"EP open → SB",                    w:2940,h:1594,split:1727,top:409},
 {id:"sb-3",pos:"SB",label:"EP open → MP call → SB",          w:2940,h:1592,split:1727,top:406},
 {id:"sb-4",pos:"SB",label:"EP open → MP call → LP call → SB",w:2940,h:1592,split:1727,top:406},
 {id:"bb-1",pos:"BB",label:"EP open → BB",                    w:2940,h:1598,split:1727,top:413},
 {id:"bb-2",pos:"BB",label:"MP open → BB",                    w:2940,h:1598,split:1727,top:413},
 {id:"bb-3",pos:"BB",label:"LP open → BB",                    w:2940,h:1598,split:1727,top:413}
];
const POS=[{k:"EP",d:"UTG"},{k:"MP",d:"HJ"},{k:"LP",d:"BTN"},{k:"SB"},{k:"BB"}];
const ACT_KO={A:"올인",R:"레이즈",C:"콜",F:"폴드"};
const COL={A:"var(--A)",R:"var(--R)",C:"var(--C)",F:"var(--F)"};
const RANKS="AKQJT98765432".split("");

let DB=null, selPos=null, selNode=null, selHand="", zoom=100;
const $=id=>document.getElementById(id);
const nodeOf=id=>NODES.find(n=>n.id===id);

/* 앞 상황만 짧게 (마지막 "→ 내 자리" 제거) */
function shortLabel(n){
  if(/open range$/.test(n.label)) return "아무도 안 들어옴";
  return n.label.replace(new RegExp("\\s*→\\s*"+n.pos+"$"),"");
}
function fmtSpot(n){
  const p=n.label.split(" → ");
  return p.map((x,i)=>i===p.length-1?"<b>"+x+"</b>":x).join(" → ");
}
function rects(n){return{
  bar:{x:0,y:84,w:n.w,h:252},
  chart:{x:0,y:n.top-8,w:n.split,h:n.h-(n.top-8)-6},
  panel:{x:n.split,y:n.top-62,w:n.w-n.split,h:n.h-(n.top-62)-6}};}
function crop(n,r){
  return '<div class="crop" style="--iw:'+n.w+';--x:'+r.x+';--y:'+r.y+';--w:'+r.w+';--h:'+r.h+
         '"><img src="img/'+n.id+'.jpg" alt="" loading="lazy"></div>';
}
function cellRect(n,hand){
  const r=rects(n).chart, left=28, cw=128, top=n.top, ch=(n.h-29-top+1)/13;
  let ri,ci;
  if(hand.length===2){ri=ci=RANKS.indexOf(hand[0]);}
  else{const a=RANKS.indexOf(hand[0]),b=RANKS.indexOf(hand[1]);
       if(hand[2]==="s"){ri=Math.min(a,b);ci=Math.max(a,b);} else {ri=Math.max(a,b);ci=Math.min(a,b);}}
  if(ri<0||ci<0)return null;
  return {l:(left+ci*cw-r.x)/r.w*100, t:(top+ri*ch-r.y)/r.h*100,
          w:cw/r.w*100, h:ch/r.h*100};
}
function normHand(s){
  s=(s||"").trim().toUpperCase().replace(/10/g,"T");
  if(!/^[AKQJT98765432]{2}[SO]?$/.test(s))return null;
  const a=s[0],b=s[1],t=s[2]||"";
  if(a===b)return a+b;
  if(!t)return null;
  const ia=RANKS.indexOf(a),ib=RANKS.indexOf(b);
  return (ia<ib?a+b:b+a)+t.toLowerCase();
}

/* ---------- 스텝 렌더 ---------- */
function renderSteps(){
  $("cPos").innerHTML="";
  POS.forEach(p=>{
    const b=document.createElement("button");
    b.className="chip"+(selPos===p.k?" on":"");
    b.innerHTML=p.k+(p.d?'<small>'+p.d+'</small>':'<small>&nbsp;</small>');
    b.onclick=()=>{selPos=p.k;selNode=null;renderSteps();render();};
    $("cPos").appendChild(b);
  });
  $("s1").className="step"+(selPos?" done":"");

  $("cNode").innerHTML="";
  const ns=selPos?NODES.filter(n=>n.pos===selPos):[];
  ns.forEach(n=>{
    const b=document.createElement("button");
    b.className="chip"+(selNode===n.id?" on":"");
    b.textContent=shortLabel(n);
    b.onclick=()=>{selNode=n.id;renderSteps();render();
      if(history.state?.v!=="spot") history.pushState({v:"spot"},"","#"+n.id);
      else history.replaceState({v:"spot"},"","#"+n.id);};
    $("cNode").appendChild(b);
  });
  $("s2").className="step"+(selPos?"":" off")+(selNode?" done":"");
  $("s3").className="step"+(selNode?"":" off")+(selHand?" done":"");
  markPick();
}
function buildPicker(){
  const pk=$("pick");
  for(let r=0;r<13;r++)for(let c=0;c<13;c++){
    const h=r===c?RANKS[r]+RANKS[r]:(r<c?RANKS[r]+RANKS[c]+"s":RANKS[c]+RANKS[r]+"o");
    const b=document.createElement("button");
    b.textContent=h;b.dataset.h=h;
    if(r===c)b.className="p";
    b.onclick=()=>{$("hIn").value=h;selHand=h;renderSteps();render();};
    pk.appendChild(b);
  }
}
function markPick(){
  [...$("pick").children].forEach(b=>b.classList.toggle("on",b.dataset.h===selHand));
}

/* ---------- 본문 ---------- */
function render(){
  const box=$("out");
  if(!selNode){ box.innerHTML=""; return; }
  const n=nodeOf(selNode), r=rects(n);
  const rec=DB?DB[selNode]:null;
  const mix=(rec&&selHand)?rec.hands[selHand]:undefined;

  let ans="";
  if(selHand){
    if(!rec) ans='<div class="none"><div class="t">…</div><div class="d">데이터 불러오는 중</div></div>';
    else if(!mix) ans='<div class="none"><div class="t">해당 없음</div>'+
      '<div class="d"><b>'+selHand+'</b>는 이 상황에 도달하지 않습니다.<br>앞 단계에서 이미 폴드되는 핸드입니다.</div></div>';
    else{
      const ks=Object.keys(mix).filter(k=>k!=="_r").sort((a,b)=>mix[b]-mix[a]);
      const top=ks[0], mixed=ks.length>1;
      ans='<div class="ans"><div class="top">'+
        '<div class="lab">'+selHand+' · '+(mixed?"혼합 전략":"정답")+'</div>'+
        '<div class="act" style="color:'+COL[top]+'">'+rec.acts[top]+'</div>'+
        '<div class="sub">'+(mixed?ks.map(k=>ACT_KO[k]+" "+mix[k]+"%").join(" · ")
                                   :"100% "+ACT_KO[top])+'</div></div>'+
        '<div class="bars">'+ks.map(k=>
          '<div class="bar"><div class="nm">'+rec.acts[k]+'</div><div class="tr">'+
          '<div class="fl" style="width:'+mix[k]+'%;background:'+COL[k]+'"></div></div>'+
          '<div class="pc">'+mix[k]+'%</div></div>').join("")+'</div>'+
        (mix._r?'<div class="note">이 핸드는 해당 상황에 <b>'+mix._r+'%</b>만 도달합니다. 앞 단계에서 일부는 다른 선택을 하기 때문입니다.</div>':"")+
        '</div>';
    }
  }
  const hl=(selHand&&mix)?(()=>{const g=cellRect(n,selHand);
      return g?'<div class="hl" style="left:'+g.l+'%;top:'+g.t+'%;width:'+g.w+'%;height:'+g.h+'%"></div>':"";})():"";

  box.innerHTML=
    '<div class="spot"><div class="k">지금 상황</div><div class="v">'+fmtSpot(n)+'</div></div>'+
    ans+
    '<section class="sec"><h3>레인지 차트'+(hl?' <span class="tg">노란 칸이 '+selHand+'</span>':'')+'</h3>'+
      '<div class="shell scroll" id="zw"><div style="position:relative">'+crop(n,r.chart)+hl+'</div></div>'+
      '<div class="zoombar"><button class="rst" id="zr">맞춤</button>'+
      '<input type="range" id="zs" min="100" max="400" step="5" value="'+zoom+'">'+
      '<span class="v" id="zv">'+zoom+'%</span></div></section>'+
    '<section class="sec"><h3>액션별 비율 · 핸드 <span class="tg">원본 요약</span></h3>'+
      '<div class="shell">'+crop(n,r.panel)+'</div></section>'+
    '<section class="sec"><h3>테이블 액션 <span class="tg">← 옆으로 밀기</span></h3>'+
      '<div class="shell scroll"><div style="width:280%">'+crop(n,r.bar)+'</div></div></section>';

  const zw=$("zw"),zs=$("zs"),zv=$("zv");
  const apply=()=>{zoom=+zs.value;zw.firstElementChild.style.width=zoom+"%";zv.textContent=zoom+"%";};
  zs.oninput=apply; $("zr").onclick=()=>{zs.value=100;apply();zw.scrollLeft=0;};
  apply();
}

/* ---------- 둘러보기 ---------- */
function renderBrowse(){
  const g=$("bgrid"); g.innerHTML="";
  NODES.forEach(n=>{
    const b=document.createElement("button");
    b.className="bcard";
    b.innerHTML='<img src="img/thumb/'+n.id+'.jpg" alt="" loading="lazy">'+
                '<div class="c">'+fmtSpot(n)+'</div>';
    b.onclick=()=>{
      selPos=n.pos; selNode=n.id; renderSteps(); render();
      $("browse").open=false;
      window.scrollTo({top:0,behavior:"smooth"});
    };
    g.appendChild(b);
  });
}

/* ---------- 이벤트 ---------- */
$("hIn").addEventListener("input",()=>{selHand=normHand($("hIn").value)||"";renderSteps();render();});
$("hIn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("hIn").blur();}});
$("hTog").onclick=()=>{const p=$("pick");p.hidden=!p.hidden;$("hTog").classList.toggle("on",!p.hidden);};
window.addEventListener("popstate",()=>{
  if(selNode){ selNode=null; selHand=""; $("hIn").value=""; renderSteps(); render();
               window.scrollTo({top:0}); }
});

buildPicker(); renderSteps(); renderBrowse();
fetch("ranges.json").then(r=>r.json()).then(d=>{DB=d;render();}).catch(()=>{});
</script>
</body>
</html>
